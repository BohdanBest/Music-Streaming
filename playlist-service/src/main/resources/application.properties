quarkus.http.port=8082

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5435/playlist_db
quarkus.hibernate-orm.database.generation=update
quarkus.datasource.devservices.enabled=false

# Security
quarkus.oidc.auth-server-url=http://localhost:8088/realms/music-streaming
quarkus.oidc.client-id=playlist-service
quarkus.oidc.devservices.enabled=false

# Client config
quarkus.rest-client.catalog-api.url=http://localhost:8081