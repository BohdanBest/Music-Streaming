syntax = "proto3";

option java_package = "com.bohdanbest.catalog.grpc";
option java_multiple_files = true;

package catalog;

service CatalogGrpcService {
  rpc AddTrack(AddTrackRequest) returns (TrackInfo);
}

message AddTrackRequest {
  string title = 1;
  string artist = 2;
  string album = 3;
  int32 duration_seconds = 4;
}

message TrackInfo {
  int64 id = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  int32 duration_seconds = 5;
}